name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.4.10
      - name: Run ruff
        run: ruff check src/ tests/ app.py ingest.py evaluate.py --ignore E501

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
        env:
          OPENAI_API_KEY: sk-dummy-key-for-ci-testing-only
          WANDB_API_KEY: dummy-wandb-key
          CHROMA_PERSIST_DIR: ./data/chroma
          NHS_DOCS_DIR: ./data/nhs_docs
